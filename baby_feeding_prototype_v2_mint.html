<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝喂养记录 · 原型</title>
<style>
  :root{
    --paper: #F5FAF3;
    --paper-line: #D3E6CB;
    --ink: #33422E;
    --ink-soft: #7E9078;
    --indigo: #4F9668;
    --indigo-soft: #DCEFDA;
    --honey: #E3A857;
    --honey-soft: #FBEBD2;
    --green: #3F8F7A;
    --green-soft: #DCEEE9;
    --coral: #E38A72;
    --coral-soft: #FBE2DA;
    --card-radius: 20px;
    --shadow: 0 6px 18px rgba(51,66,46,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#E8F0E4;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:32px 12px;
    color:var(--ink);
  }
  .studio-note{
    position:fixed;
    top:16px; left:16px;
    font-size:12px;
    color:#A9BFA1;
    max-width:180px;
    line-height:1.5;
    display:none;
  }
  @media (min-width:900px){ .studio-note{display:block;} }

  /* ---- phone frame ---- */
  .phone{
    width:375px;
    min-height:800px;
    background:var(--paper);
    border-radius:44px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.28), 0 0 0 10px #2b2620;
    position:relative;
    overflow:hidden;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:140px; height:26px; background:#2b2620;
    border-radius:0 0 18px 18px; z-index:50;
  }
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px 4px; font-size:13px; font-weight:600; color:var(--ink);
  }

  /* spiral notebook motif referencing the original paper log */
  .spiral-strip{
    display:flex; justify-content:space-evenly;
    padding:2px 30px 0;
  }
  .spiral-strip span{
    width:8px; height:8px; border-radius:50%;
    background:var(--paper);
    border:2px solid var(--paper-line);
  }

  .screen{ display:none; padding:6px 20px 100px; }
  .screen.active{ display:block; }

  .brand-title{
    font-family:"Kaiti SC","STKaiti","Noto Serif SC",serif;
    font-size:26px;
    margin:14px 0 2px;
    letter-spacing:1px;
  }
  .brand-sub{
    font-size:13px; color:var(--ink-soft);
    display:flex; gap:10px; margin-bottom:16px;
  }

  /* last-feed bottle card */
  .last-feed-card{
    background:var(--indigo);
    color:#fff;
    border-radius:var(--card-radius);
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  .bottle-icon{
    width:46px; height:46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    background:rgba(255,255,255,0.15);
    border-radius:14px;
  }
  .last-feed-text .label{ font-size:12px; opacity:0.8; }
  .last-feed-text .value{ font-size:19px; font-weight:700; margin-top:2px; }
  .level-bar{
    margin-top:8px; height:6px; width:100%; background:rgba(255,255,255,0.2);
    border-radius:4px; overflow:hidden;
  }
  .level-bar i{ display:block; height:100%; width:46%; background:var(--honey); border-radius:4px; }

  /* quick action grid */
  .grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:12px; margin-bottom:20px;
  }
  .action-card{
    border:none; cursor:pointer;
    border-radius:var(--card-radius);
    padding:20px 14px;
    text-align:left;
    box-shadow:var(--shadow);
    font-family:inherit;
    transition:transform .12s ease;
  }
  .action-card:active{ transform:scale(0.96); }
  .action-card .icon{ font-size:28px; display:block; margin-bottom:10px; }
  .action-card .name{ font-size:16px; font-weight:700; }
  .action-card .hint{ font-size:11px; margin-top:2px; opacity:0.7; }
  .card-feed{ background:var(--honey-soft); color:#8A5A16; }
  .card-poop{ background:#EFE3D0; color:#6B4A28; }
  .card-sleep{ background:var(--indigo-soft); color:var(--indigo); }
  .card-med{ background:var(--green-soft); color:#2C6B5C; }

  /* timeline */
  .section-title{
    font-size:15px; font-weight:700; margin:18px 0 10px;
    color:var(--ink-soft);
  }
  .timeline{ position:relative; padding-left:18px; }
  .timeline:before{
    content:""; position:absolute; left:5px; top:6px; bottom:6px;
    width:1px; background:var(--paper-line);
    background-image:linear-gradient(var(--paper-line) 60%, transparent 0%);
    background-size:1px 8px;
  }
  .t-item{
    position:relative; padding:10px 0; display:flex; justify-content:space-between; align-items:flex-start;
  }
  .t-item:before{
    content:""; position:absolute; left:-18px; top:16px;
    width:9px; height:9px; border-radius:50%; background:var(--indigo);
    border:2px solid var(--paper);
  }
  .t-item.feed:before{ background:var(--honey); }
  .t-item.poop:before{ background:#A9784A; }
  .t-item.sleep:before{ background:var(--indigo); }
  .t-item.med:before{ background:var(--green); }
  .t-main{ font-size:14px; }
  .t-time{ font-size:12px; color:var(--ink-soft); display:block; }
  .t-more{
    border:none; background:none; color:var(--ink-soft);
    font-size:18px; cursor:pointer; padding:2px 6px;
  }
  .filter-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    margin-bottom:4px; scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    white-space:nowrap; padding:7px 14px; border-radius:14px;
    border:1.5px solid var(--paper-line); background:#fff;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer; font-family:inherit;
  }
  .filter-chip.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  .timeline-empty{
    display:none; text-align:center; color:var(--ink-soft);
    font-size:13px; padding:22px 0;
  }

  /* mic floating button */
  .mic-dock{
    position:absolute; left:0; right:0; bottom:0;
    padding:14px 20px 22px;
    background:linear-gradient(0deg, var(--paper) 60%, transparent);
  }
  .mic-btn{
    width:100%; border:none; border-radius:30px;
    background:var(--indigo); color:#fff;
    padding:16px; font-size:16px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; box-shadow:0 10px 24px rgba(67,85,112,0.35);
  }
  .mic-btn .dot{
    width:10px;height:10px;border-radius:50%;background:var(--coral);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 0%{transform:scale(1); opacity:1;} 50%{transform:scale(1.6); opacity:0.4;} 100%{transform:scale(1); opacity:1;} }

  /* bottom sheet */
  .sheet-overlay{
    position:absolute; inset:0; background:rgba(30,26,20,0.45);
    display:none; align-items:flex-end; z-index:80;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; background:var(--paper);
    border-radius:24px 24px 0 0;
    padding:20px 22px 26px;
  }
  .sheet h3{ margin:0 0 4px; font-size:18px; }
  .sheet p.desc{ font-size:12px; color:var(--ink-soft); margin:0 0 16px;}
  .qty-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .qty-chip{
    padding:12px 18px; border-radius:14px; border:2px solid var(--paper-line);
    background:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  .qty-chip.selected{ border-color:var(--honey); background:var(--honey-soft); }
  .sheet-confirm{
    width:100%; padding:15px; border:none; border-radius:16px;
    background:var(--green); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  .sheet-cancel{
    width:100%; padding:12px; border:none; background:none;
    color:var(--ink-soft); font-size:14px; margin-top:6px; cursor:pointer;
  }

  /* voice modal */
  .voice-overlay{
    position:absolute; inset:0; background:rgba(30,26,20,0.55);
    display:none; align-items:center; justify-content:center; z-index:90;
  }
  .voice-overlay.active{ display:flex; }
  .voice-card{
    width:86%; background:var(--paper); border-radius:24px; padding:28px 22px; text-align:center;
  }
  .wave{ display:flex; gap:5px; justify-content:center; align-items:flex-end; height:44px; margin-bottom:16px; }
  .wave i{ width:5px; background:var(--indigo); border-radius:3px; animation:wave 1s infinite ease-in-out; }
  .wave i:nth-child(1){height:14px; animation-delay:0s;}
  .wave i:nth-child(2){height:30px; animation-delay:.1s;}
  .wave i:nth-child(3){height:44px; animation-delay:.2s;}
  .wave i:nth-child(4){height:24px; animation-delay:.3s;}
  .wave i:nth-child(5){height:36px; animation-delay:.4s;}
  .wave i:nth-child(6){height:16px; animation-delay:.5s;}
  @keyframes wave{ 0%,100%{transform:scaleY(0.4);} 50%{transform:scaleY(1);} }
  .voice-status{ font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
  .voice-heard{ font-size:15px; margin-bottom:18px; min-height:20px;}
  .voice-result{ display:none; }
  .voice-result.show{ display:block; }
  .voice-result-card{
    background:var(--honey-soft); border-radius:16px; padding:16px; margin-bottom:18px;
  }
  .voice-result-card .big{ font-size:22px; font-weight:800; color:#8A5A16; }
  .voice-result-card .small{ font-size:12px; color:#8A5A16; opacity:0.75; margin-top:2px;}
  .voice-btn-row{ display:flex; gap:10px; }
  .voice-btn-row button{
    flex:1; padding:13px; border-radius:14px; border:none; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-redo{ background:#EFE3D0; color:#6B4A28; }
  .btn-confirm{ background:var(--green); color:#fff; }

  /* history screen */
  .day-switch{
    display:flex; align-items:center; justify-content:space-between;
    margin:14px 0 16px;
  }
  .day-switch button{
    border:none; background:var(--indigo-soft); color:var(--indigo);
    width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .day-switch .day-label{ font-size:15px; font-weight:700; text-align:center; }
  .day-label small{ display:block; font-weight:400; color:var(--ink-soft); font-size:12px; }
  .log-table{ width:100%; border-collapse:collapse; }
  .log-table tr{ border-bottom:1px dashed var(--paper-line); }
  .log-table td{ padding:10px 4px; font-size:13.5px; vertical-align:top; }
  .log-table td.time{ color:var(--ink-soft); width:52px; }
  .log-table td.amt{ font-weight:700; color:var(--indigo); white-space:nowrap; }
  .log-table td.tag{
    font-size:11px; background:var(--green-soft); color:#2C6B5C;
    padding:2px 8px; border-radius:8px; white-space:nowrap;
  }

  /* tab bar */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; background:#fff; border-top:1px solid var(--paper-line);
    z-index:40;
  }
  .tabbar button{
    flex:1; border:none; background:none; padding:10px 0 8px;
    font-size:11px; color:var(--ink-soft); cursor:pointer;
  }
  .tabbar button .ic{ display:block; font-size:19px; margin-bottom:2px; }
  .tabbar button.active{ color:var(--indigo); font-weight:700; }
  .screen{ padding-bottom:150px; }
  #home .mic-dock{ bottom:56px; }
</style>
</head>
<body>

<div class="studio-note">静态原型 · 演示用<br>点击喂奶/排便/睡眠/用药卡片、麦克风按钮、底部"历史"标签均可交互</div>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span>🔋 100%</span>
  </div>
  <div class="spiral-strip">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="home">
    <div class="brand-title">宝宝喂养记录</div>
    <div class="brand-sub"><span>6月7日 星期六</span><span>天气 晴</span><span style="background:var(--indigo-soft); color:var(--indigo); padding:2px 9px; border-radius:9px; font-size:11px;">方案2 · 小清新</span></div>

    <div class="last-feed-card">
      <div class="bottle-icon">🍼</div>
      <div class="last-feed-text" style="flex:1;">
        <div class="label">距上次喂奶</div>
        <div class="value">2小时15分前 · 10:00</div>
        <div class="level-bar"><i></i></div>
      </div>
    </div>

    <div class="grid">
      <button class="action-card card-feed" onclick="openSheet('feed')">
        <span class="icon">🍼</span>
        <span class="name">喂奶</span>
        <span class="hint">母乳 / 奶粉 / 混合</span>
      </button>
      <button class="action-card card-poop" onclick="quickLog('poop','排便记录已添加','💩')">
        <span class="icon">💩</span>
        <span class="name">排便</span>
        <span class="hint">一键记录</span>
      </button>
      <button class="action-card card-sleep" onclick="openSheet('sleep')">
        <span class="icon">😴</span>
        <span class="name">睡眠</span>
        <span class="hint">入睡 / 醒来</span>
      </button>
      <button class="action-card card-med" onclick="openSheet('med')">
        <span class="icon">💊</span>
        <span class="name">用药 / 补充剂</span>
        <span class="hint">D3 · DHA · 其他</span>
      </button>
    </div>

    <div class="section-title">今日记录</div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" onclick="setFilter('all',this)">全天</button>
      <button class="filter-chip" onclick="setFilter('0-6',this)">凌晨</button>
      <button class="filter-chip" onclick="setFilter('6-12',this)">上午</button>
      <button class="filter-chip" onclick="setFilter('12-18',this)">下午</button>
      <button class="filter-chip" onclick="setFilter('18-24',this)">晚上</button>
      <button class="filter-chip" onclick="openCustomRange()">自定义</button>
    </div>
    <div class="timeline" id="todayTimeline">
      <div class="t-item feed" data-time="09:10">
        <div><span class="t-time">09:10</span><span class="t-main">奶粉 70ml</span></div>
        <button class="t-more">···</button>
      </div>
      <div class="t-item" data-time="10:00">
        <div><span class="t-time">10:00</span><span class="t-main">辅食：小米粥、南瓜泥（少许）</span></div>
        <button class="t-more">···</button>
      </div>
    </div>
    <div class="timeline-empty" id="timelineEmpty">这段时间还没有记录</div>

    <div class="mic-dock">
      <button class="mic-btn" onclick="startVoice()">
        <span class="dot"></span> 🎤 说一句话记录
      </button>
    </div>
  </div>

  <!-- HISTORY SCREEN -->
  <div class="screen" id="history">
    <div class="brand-title" style="font-size:22px;">历史记录</div>
    <div class="day-switch">
      <button onclick="changeDay(-1)">‹</button>
      <div class="day-label" id="dayLabel">6月5日<small>星期五 · 天气晴</small></div>
      <button onclick="changeDay(1)">›</button>
    </div>
    <table class="log-table" id="historyTable"></table>
    <div class="section-title" style="margin-top:22px;">当日小结</div>
    <div class="last-feed-card" style="background:var(--green); margin-bottom:0;">
      <div class="bottle-icon">📊</div>
      <div class="last-feed-text">
        <div class="label">总奶量</div>
        <div class="value" id="daySummary">760ml · 6次</div>
      </div>
    </div>
  </div>

  <!-- bottom sheet: quick amount picker -->
  <div class="sheet-overlay" id="sheetOverlay">
    <div class="sheet">
      <h3 id="sheetTitle">喂奶</h3>
      <p class="desc" id="sheetDesc">选择方式和奶量，时间默认为当前，可直接保存</p>
      <div class="qty-row" id="typeRow"></div>
      <div class="qty-row" id="qtyRow"></div>
      <button class="sheet-confirm" onclick="confirmSheet()">保存记录</button>
      <button class="sheet-cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <!-- voice modal -->
  <div class="voice-overlay" id="voiceOverlay">
    <div class="voice-card">
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="voice-status" id="voiceStatus">正在聆听，请说话…</div>
      <div class="voice-heard" id="voiceHeard"></div>
      <div class="voice-result" id="voiceResult">
        <div class="voice-result-card">
          <div class="big">奶粉 145ml</div>
          <div class="small">备注：加了 D3 · 识别时间 刚刚</div>
        </div>
        <div class="voice-btn-row">
          <button class="btn-redo" onclick="startVoice()">重新说</button>
          <button class="btn-confirm" onclick="confirmVoice()">确认保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- custom time range picker -->
  <div class="sheet-overlay" id="rangeOverlay">
    <div class="sheet">
      <h3>自定义时间段</h3>
      <p class="desc">选择开始和结束时间，查看这段时间内的记录</p>
      <div style="display:flex; gap:12px; margin-bottom:18px;">
        <div style="flex:1;">
          <label style="font-size:12px;color:var(--ink-soft);">开始时间</label><br>
          <input type="time" id="rangeStart" value="09:00" style="width:100%;padding:10px;border-radius:12px;border:2px solid var(--paper-line);font-size:15px;margin-top:4px;font-family:inherit;">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px;color:var(--ink-soft);">结束时间</label><br>
          <input type="time" id="rangeEnd" value="12:00" style="width:100%;padding:10px;border-radius:12px;border:2px solid var(--paper-line);font-size:15px;margin-top:4px;font-family:inherit;">
        </div>
      </div>
      <button class="sheet-confirm" onclick="applyCustomRange()">查看这段时间</button>
      <button class="sheet-cancel" onclick="closeRangeSheet()">取消</button>
    </div>
  </div>

  <div class="tabbar">
    <button class="active" id="tabHome" onclick="showScreen('home')"><span class="ic">🏠</span>首页</button>
    <button id="tabHistory" onclick="showScreen('history')"><span class="ic">📖</span>历史</button>
  </div>
</div>

<script>
// ---------- tab switching ----------
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('tabHome').classList.toggle('active', id==='home');
  document.getElementById('tabHistory').classList.toggle('active', id==='history');
  if(id==='history') renderHistory();
}

// ---------- quick add to today's timeline ----------
function addTimelineItem(cls, timeLabel, text){
  const tl = document.getElementById('todayTimeline');
  const div = document.createElement('div');
  div.className = 't-item ' + cls;
  div.dataset.time = timeLabel;
  div.innerHTML = `<div><span class="t-time">${timeLabel}</span><span class="t-main">${text}</span></div><button class="t-more">···</button>`;
  tl.appendChild(div);
  resetFilterToAll();
}
function nowLabel(){
  const d = new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function quickLog(cls, text, icon){
  addTimelineItem(cls, nowLabel(), text);
}

// ---------- time-range filter for today's timeline ----------
function timeToMinutes(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}
function toggleEmptyState(show){
  document.getElementById('timelineEmpty').style.display = show ? 'block' : 'none';
}
function filterByRange(startMin, endMin){
  let anyVisible = false;
  document.querySelectorAll('#todayTimeline .t-item').forEach(item=>{
    const t = item.dataset.time;
    if(!t){ item.style.display='none'; return; }
    const mins = timeToMinutes(t);
    const visible = endMin >= startMin
      ? (mins >= startMin && mins <= endMin)
      : (mins >= startMin || mins <= endMin); // handles overnight ranges
    item.style.display = visible ? 'flex' : 'none';
    if(visible) anyVisible = true;
  });
  toggleEmptyState(!anyVisible);
}
function showAllTimeline(){
  document.querySelectorAll('#todayTimeline .t-item').forEach(i=>i.style.display='flex');
  toggleEmptyState(false);
}
function setFilter(range, el){
  document.querySelectorAll('#filterRow .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  if(range === 'all'){ showAllTimeline(); return; }
  const [s,e] = range.split('-').map(Number);
  filterByRange(s*60, e*60);
}
function resetFilterToAll(){
  document.querySelectorAll('#filterRow .filter-chip').forEach((c,i)=>{
    c.classList.toggle('active', i===0);
    if(i===5) c.innerText = '自定义'; // restore custom chip label if it was overwritten
  });
  showAllTimeline();
}
function openCustomRange(){
  document.getElementById('rangeOverlay').classList.add('active');
}
function closeRangeSheet(){
  document.getElementById('rangeOverlay').classList.remove('active');
}
function applyCustomRange(){
  const start = document.getElementById('rangeStart').value;
  const end = document.getElementById('rangeEnd').value;
  if(!start || !end) return;
  filterByRange(timeToMinutes(start), timeToMinutes(end));
  document.querySelectorAll('#filterRow .filter-chip').forEach(c=>c.classList.remove('active'));
  const chips = document.querySelectorAll('#filterRow .filter-chip');
  chips[chips.length-1].classList.add('active');
  chips[chips.length-1].innerText = start + '–' + end;
  closeRangeSheet();
}

// ---------- bottom sheet ----------
let currentSheetType = null;
let sheetSelection = { type:null, qty:null };
const sheetConfig = {
  feed: { title:'喂奶', desc:'选择方式和奶量，时间默认为当前', types:['母乳','混合','奶粉'], qtys:['50ml','80ml','100ml','120ml','145ml','150ml'] },
  sleep:{ title:'睡眠', desc:'记录入睡或醒来', types:['入睡','醒来'], qtys:[] },
  med:  { title:'用药 / 补充剂', desc:'选择今天吃的补充剂', types:['D3','DHA','益生菌','其他'], qtys:[] }
};
function openSheet(type){
  currentSheetType = type;
  sheetSelection = { type:null, qty:null };
  const cfg = sheetConfig[type];
  document.getElementById('sheetTitle').innerText = cfg.title;
  document.getElementById('sheetDesc').innerText = cfg.desc;
  const typeRow = document.getElementById('typeRow');
  typeRow.innerHTML = cfg.types.map(t=>`<button class="qty-chip" onclick="pick('type',this,'${t}')">${t}</button>`).join('');
  const qtyRow = document.getElementById('qtyRow');
  qtyRow.innerHTML = cfg.qtys.map(q=>`<button class="qty-chip" onclick="pick('qty',this,'${q}')">${q}</button>`).join('');
  document.getElementById('sheetOverlay').classList.add('active');
}
function pick(kind, el, val){
  const row = el.parentElement;
  row.querySelectorAll('.qty-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  sheetSelection[kind] = val;
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('active');
}
function confirmSheet(){
  const cfg = sheetConfig[currentSheetType];
  let text = sheetSelection.type || cfg.title;
  if(sheetSelection.qty) text += ' ' + sheetSelection.qty;
  const clsMap = { feed:'feed', sleep:'sleep', med:'med' };
  addTimelineItem(clsMap[currentSheetType], nowLabel(), text);
  closeSheet();
}

// ---------- voice modal ----------
function startVoice(){
  document.getElementById('voiceOverlay').classList.add('active');
  document.getElementById('voiceResult').classList.remove('show');
  document.getElementById('voiceStatus').innerText = '正在聆听，请说话…';
  document.getElementById('voiceHeard').innerText = '';
  document.getElementById('wave').style.display = 'flex';
  const phrase = '喝了一百四十五毫升奶粉，加了D3';
  let i = 0;
  const typer = setInterval(()=>{
    i++;
    document.getElementById('voiceHeard').innerText = phrase.slice(0,i);
    if(i>=phrase.length){
      clearInterval(typer);
      document.getElementById('voiceStatus').innerText = '正在识别中…';
      setTimeout(()=>{
        document.getElementById('wave').style.display = 'none';
        document.getElementById('voiceStatus').innerText = '识别结果';
        document.getElementById('voiceResult').classList.add('show');
      }, 700);
    }
  }, 55);
}
function confirmVoice(){
  addTimelineItem('feed', nowLabel(), '奶粉 145ml（备注：D3）');
  document.getElementById('voiceOverlay').classList.remove('active');
}
document.getElementById('voiceOverlay').addEventListener('click', e=>{
  if(e.target.id==='voiceOverlay'){ /* tap outside does nothing, avoid accidental close for elderly users */ }
});

function changeDay(delta){
